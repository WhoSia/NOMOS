name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_deadlock860.mjs
      - run: node tests/test_deadlock860_exhaustive.mjs
      - run: node tests/test_deadlock860_nonidentifiability.mjs
      - run: node tests/test_attest861.mjs
      - run: node tests/test_governance862.mjs
      - run: node tests/test_governance862_integration.mjs
      - run: node tests/test_petition862.mjs
      - run: node tests/test_remedyReach863.mjs
      - run: node tests/test_remedyReach863_integration.mjs
      - run: node tests/test_remedyReach863_nonidentifiability.mjs
      - run: node tests/test_remedyReach863_exhaustive.mjs
      - run: node tests/test_consequenceRepair864.mjs
      - run: node tests/test_observationAuthority865.mjs
      - run: node tests/test_consequenceEvidence865.mjs
      - run: node tests/test_judgmentReinstatement866.mjs
      - run: node tests/test_stigmaBoundary866.mjs
      - run: node tests/test_echoCorrection866.mjs
      - run: node tests/test_feedback866.mjs
      - run: node tests/test_dissent869.mjs
      - run: node tests/test_contestability869.mjs
      - run: node tests/test_uptake870.mjs
      - run: node tools/deadlock860.mjs examples/deadlock860_cases.json
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m nomos examples/shared_success.json
      - run: PYTHONPATH=src python -m nomos examples/derived_record_valid.json --trace r1
      - run: PYTHONPATH=src python -m nomos examples/review_topology_calibration.json --calibrate-review
      - run: PYTHONPATH=src python -m nomos examples/router_contestable.json --audit-router
      - run: PYTHONPATH=src python -m nomos examples/routing_learning_audited.json --audit-routing-learning
      - run: PYTHONPATH=src python -m nomos examples/feedback_restoration_safe.json --plan-feedback-restoration
      - run: PYTHONPATH=src python -m nomos examples/review_divergence_mismatch.json --audit-review-divergence
      - run: PYTHONPATH=src python -m nomos examples/review_divergence_localized.json --audit-review-divergence
      - run: PYTHONPATH=src python -m nomos examples/review_divergence_residual.json --audit-review-divergence
      - run: PYTHONPATH=src python -m nomos examples/record_portability_safe.json --audit-record-portability
      - run: PYTHONPATH=src python -m nomos examples/correction_propagation_safe.json --audit-correction-propagation
      - run: PYTHONPATH=src python -m nomos examples/correction_concurrency_safe.json --audit-correction-concurrency
      - run: PYTHONPATH=src python -m nomos examples/correction_compaction_safe.json --audit-correction-compaction
      - run: PYTHONPATH=src python -m nomos examples/historical_reopening_safe.json --audit-historical-reopening
      - run: PYTHONPATH=src python -m nomos examples/joint_repair_safe.json --audit-joint-repair
      - run: |
          if PYTHONPATH=src python -m nomos examples/joint_repair_unsafe.json --audit-joint-repair; then
            echo "unsafe joint repair fixture unexpectedly passed"
            exit 1
          fi
      - run: PYTHONPATH=src python -m nomos examples/successor_duties_safe.json --audit-successor-duties
      - run: |
          if PYTHONPATH=src python -m nomos examples/successor_duties_unsafe.json --audit-successor-duties; then
            echo "unsafe successor-duty fixture unexpectedly passed"
            exit 1
          fi
      - run: PYTHONPATH=src python -m nomos examples/restitution_safe.json --audit-restitution
      - run: |
          if PYTHONPATH=src python -m nomos examples/restitution_unsafe.json --audit-restitution; then
            echo "unsafe restitution fixture unexpectedly passed"
            exit 1
          fi
      - run: PYTHONPATH=src python -m nomos examples/interim_protection_safe.json --audit-interim-protection
      - run: |
          if PYTHONPATH=src python -m nomos examples/interim_protection_unsafe.json --audit-interim-protection; then
            echo "unsafe interim-protection fixture unexpectedly passed"
            exit 1
          fi
      - run: PYTHONPATH=src python -m nomos examples/recall_triage_safe.json --audit-recall-triage
      - run: |
          if PYTHONPATH=src python -m nomos examples/recall_triage_unsafe.json --audit-recall-triage; then
            echo "unsafe recall-triage fixture unexpectedly passed"
            exit 1
          fi
      - run: PYTHONPATH=src python -m nomos examples/systemic_reopening_safe.json --audit-systemic-reopening
      - run: |
          if PYTHONPATH=src python -m nomos examples/systemic_reopening_unsafe.json --audit-systemic-reopening; then
            echo "unsafe systemic-reopening fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/historical_reopening_unsafe.json --audit-historical-reopening; then
            echo "unsafe historical-reopening fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/correction_concurrency_unsafe.json --audit-correction-concurrency; then
            echo "unsafe correction-concurrency fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/correction_propagation_unsafe.json --audit-correction-propagation; then
            echo "unsafe correction-propagation fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/record_portability_unsafe.json --audit-record-portability; then
            echo "unsafe record-portability fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/invalid_person_inference.json; then
            echo "invalid person-inference fixture unexpectedly passed"
            exit 1
          fi
      - run: |
          if PYTHONPATH=src python -m nomos examples/dependency_erasure.json; then
            echo "dependency-erasure fixture unexpectedly passed"
            exit 1
          fi
